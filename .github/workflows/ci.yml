name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: claudsidian-bundle
          path: |
            main.js
            styles.css
            manifest.json
          if-no-files-found: error
