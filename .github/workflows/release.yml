name: Release Obsidian plugin

# Every push to main publishes a release tagged <manifest version>-<short sha>, which BRAT consumes
# (BRAT reads the latest full release, so these are not marked prerelease). A pushed tag releases under that tag.
on:
  push:
    tags:
      - '*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine version tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            BASE_VERSION=$(node -p "require('./manifest.json').version")
            SHORT_SHA=$(git rev-parse --short HEAD)
            TAG="${BASE_VERSION}-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title="$RELEASE_TAG" \
            --generate-notes \
            manifest.json main.js styles.css
